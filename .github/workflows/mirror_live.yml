name: Mirror Upbit Materials (live 5min + shards)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes (UTC)

permissions:
  contents: write

concurrency:
  group: mirror-upbit
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-24.04
    env:
      BASE: "https://api.shenqn.uk"
      CHUNK: "15"
      UA: "GA-mirror/1.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Build KRW market list (from Upbit public API)
        shell: bash
        run: |
          set -euo pipefail
          curl -4fsSL "https://api.upbit.com/v1/market/all?isDetails=false" -H "User-Agent: $UA" \
            | jq -r '.[].market' | grep '^KRW-' > markets.txt
          echo "::notice title=KRW markets::$(wc -l < markets.txt)"

      - name: Fetch materials in chunks (robust)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf parts && mkdir -p parts
          mapfile -t ARR < markets.txt
          n=${#ARR[@]}
          echo "::group::Chunk plan"; echo "total_markets=$n chunk_size=$CHUNK"; echo "::endgroup::"
          i=0; idx=1
          while [ $i -lt $n ]; do
            part=$(IFS=,; printf "%s" "${ARR[*]:i:CHUNK}")
            enc_part=$(printf '%s' "$part" | jq -sRr @uri)
            out="parts/part_${idx}.json"
            ok=0
            for attempt in {1..8}; do
              delay=$(python3 - <<'PY'
import random,sys
a=int(sys.argv[1]); base=[0.0,0.6,1.0,1.7,3.0,5.0,8.0,13.0][a-1]
print(base+random.uniform(0,0.7))
PY
              "$attempt")
              echo "attempt=$attempt sleep=${delay}s"; sleep "$delay"
              url="${BASE}/materials.json?mode=selected&full=1&markets=${enc_part}"
              code=$(curl -4sS -H "User-Agent: $UA" -H "Accept: application/json" -w "%{http_code}" -o "$out.tmp" --max-time 40 "$url" || true)
              echo "HTTP=$code"
              if [ "$code" = "200" ] && jq -e '(.markets|type=="array") and (.markets|length>=1)' "$out.tmp" >/dev/null 2>&1; then
                mv "$out.tmp" "$out"; ok=1; break
              fi
            done
            [ "$ok" = "1" ] || { echo "::warning title=Chunk failed::part_${idx}"; rm -f "$out.tmp"; }
            i=$((i+CHUNK)); idx=$((idx+1))
          done
          ls -1 parts/part_*.json 2>/dev/null | sort > parts/list.txt || true
          echo "::notice title=Parts fetched::$(wc -l < parts/list.txt || echo 0)"

      - name: Merge parts → LLM_MATERIALS.json (and verify)
        shell: bash
        run: |
          set -euo pipefail
          files=$(cat parts/list.txt || true)
          if [ -z "${files}" ]; then
            echo "::error title=No parts::No successful part files"
            exit 1
          fi
          jq -s '
            def valid: type=="object" and (.markets|type=="array");
            def GOOD: [ .[] | select(valid) ];
            def M: [ GOOD[] | .markets[] ];
            def FIRST: (GOOD | first) // {};
            {
              version: (FIRST.version // "LLM_MATERIALS_V1"),
              timestamps: (FIRST.timestamps // {kst:"",utc:""}),
              meta: (
                (FIRST.meta // {}) as $m
                | ($m + {params: (($m.params // {}) + {markets: (M | map(.market) | unique)})})
              ),
              markets: (M | unique_by(.market))
            }' $files > LLM_MATERIALS.json
          total=$(jq '.markets|length' LLM_MATERIALS.json)
          echo "::notice title=Total merged markets::$total"

      - name: Commit LLM_MATERIALS.json if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- LLM_MATERIALS.json; then
            git add LLM_MATERIALS.json
            git commit -m "chore(mirror-live): update LLM_MATERIALS.json"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
            git push origin HEAD:"${GITHUB_REF_NAME:-main}" || true
            echo "::notice title=Commit::Pushed updated LLM_MATERIALS.json"
          else
            echo "::notice title=Commit::No changes to commit"
          fi

      - name: Generate & commit 10 shards (materials_10/)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/split_llm_materials.py || true
          bash -c 'python3 scripts/split_llm_materials.py'
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- materials_10/; then
            git add materials_10/*.json || true
            git commit -m "chore(mirror-live): update materials_10 shards"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
            git push origin HEAD:"${GITHUB_REF_NAME:-main}" || true
            echo "::notice title=Commit::Pushed materials_10 shards"
          else
            echo "::notice title=Commit::No shard changes"
          fi
