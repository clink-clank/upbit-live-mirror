name: Mirror Live v20
'on':
  workflow_call: {}
  workflow_dispatch: {}
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Setup jq
        run: 'set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y jq

          jq --version

          '
      - name: Build KRW market list (Upbit)
        run: "set -euo pipefail\ncurl -4fsSL \"https://api.upbit.com/v1/market/all?isDetails=false\"\
          \ -H \"User-Agent: GA-mirror/1.1\" \\\n  | jq -r '.[].market' | grep '^KRW-'\
          \ > markets.txt\necho \"::notice title=KRW markets::$(wc -l < markets.txt)\"\
          \n"
      - name: Fetch materials in chunks
        env:
          CHUNK: '10'
        run: "set -euo pipefail\nrm -rf parts && mkdir -p parts\nmapfile -t ARR <\
          \ markets.txt\nn=${#ARR[@]}; i=0; idx=1\nwhile [ $i -lt $n ]; do\n  part=$(IFS=,;\
          \ printf '%s' \"${ARR[*]:i:${CHUNK}}\")\n  enc_part=$(printf '%s' \"$part\"\
          \ | jq -sRr @uri)\n  out=\"parts/part_${idx}.json\"; ok=0\n  for attempt\
          \ in 1 2 3 4 5; do\n    url=\"https://api.shenqn.uk/materials.json?mode=selected&full=1&markets=${enc_part}\"\
          \n    code=$(curl -4sS -H \"User-Agent: GA-mirror/1.1\" -H \"Accept: application/json\"\
          \ \\\n          -w \"%{http_code}\" -o \"$out.tmp\" --max-time 60 \"$url\"\
          \ || true)\n    if [ \"$code\" = \"200\" ] && jq -e '(.markets|type==\"\
          array\") and (.markets|length>=1)' \"$out.tmp\" >/dev/null 2>&1; then\n\
          \      mv \"$out.tmp\" \"$out\"; ok=1; break\n    fi\n    sleep 1\n  done\n\
          \  [ \"$ok\" = \"1\" ] || { echo \"::warning::part ${idx} failed\"; rm -f\
          \ \"$out.tmp\"; }\n  i=$((i+CHUNK)); idx=$((idx+1))\ndone\nls -1 parts/part_*.json\
          \ 2>/dev/null | sort > parts/list.txt || true\n"
      - name: Merge -> LLM_MATERIALS.json
        run: "set -euo pipefail\nfiles=$(cat parts/list.txt 2>/dev/null || true)\n\
          if [ -n \"${files}\" ]; then\n  jq -s '\n    def valid: type==\"object\"\
          \ and (.markets|type==\"array\");\n    def GOOD: [ .[] | select(valid) ];\n\
          \    def M: [ GOOD[] | .markets[] ];\n    def FIRST: (GOOD | first) // {};\n\
          \    {\n      version: (FIRST.version // \"LLM_MATERIALS_V1\"),\n      timestamps:\
          \ (FIRST.timestamps // {kst:\"\",utc:\"\"}),\n      meta: ((FIRST.meta //\
          \ {}) as $m | ($m + {params: (($m.params // {}) + {markets: (M | map(.market)\
          \ | unique)})})),\n      markets: (M | unique_by(.market))\n    }' $files\
          \ > LLM_MATERIALS.json\nelse\n  echo \"{}\" > LLM_MATERIALS.json\nfi\n"
      - name: Commit if changed
        run: "set -euo pipefail\ngit config user.name \"github-actions[bot]\"\ngit\
          \ config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\
          \nif ! git diff --quiet -- LLM_MATERIALS.json; then\n  git add LLM_MATERIALS.json\n\
          \  git commit -m \"chore(live): update LLM_MATERIALS.json (v20)\"\n  git\
          \ pull --rebase --autostash origin \"${GITHUB_REF_NAME:-main}\" || true\n\
          \  git push origin HEAD:\"${GITHUB_REF_NAME:-main}\" || true\nelse\n  echo\
          \ \"::notice title=Commit::No changes\"\nfi\n"
