name: Materials Pipeline (5m)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes

permissions:
  contents: write

concurrency:
  group: materials-pipeline
  cancel-in-progress: true

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    env:
      CHUNK: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup jq
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq
          jq --version

      - name: Build KRW market list (Upbit)
        run: |
          set -euo pipefail
          curl -fsSL "https://api.upbit.com/v1/market/all?isDetails=false" -H "User-Agent: GA-mirror/1.1"                 | jq -r '.[].market' | grep '^KRW-' > markets.txt
          echo "KRW markets: $(wc -l < markets.txt)"

      - name: Fetch materials in chunks
        env:
          CHUNK: ${{ env.CHUNK }}
        run: |
          set -euo pipefail
          rm -rf parts && mkdir -p parts
          mapfile -t ARR < markets.txt
          n=${#ARR[@]}; i=0; idx=1
          while [ $i -lt $n ]; do
            part=$(IFS=,; printf '%s' "${ARR[*]:i:${CHUNK}}")
            enc_part=$(printf '%s' "$part" | jq -sRr @uri)
            out="parts/part_${idx}.json"; ok=0
            for attempt in 1 2 3 4 5; do
              url="https://api.shenqn.uk/materials.json?mode=selected&full=1&markets=${enc_part}"
              code=$(curl -fsS -w "%{http_code}" -o "$out.tmp" --max-time 60 "$url" || true)
              if [ "$code" = "200" ] && jq -e '(.markets|type=="array") and (.markets|length>=1)' "$out.tmp" >/dev/null 2>&1; then
                mv "$out.tmp" "$out"; ok=1; break
              fi
              sleep 1
            done
            [ "$ok" = "1" ] || { echo "::warning::part ${idx} failed"; rm -f "$out.tmp"; }
            i=$((i+CHUNK)); idx=$((idx+1))
          done
          ls -1 parts/part_*.json 2>/dev/null | sort > parts/list.txt || true

      - name: Join → web/docs/LLM_MATERIALS.json
        run: |
          set -euo pipefail
          mkdir -p web/docs
          jq -s '
            reduce .[] as $p (
              {"version":"LLM_MATERIALS_V1","timestamps":{"utc":(now|todateiso8601)},"markets":[]};
              .markets += ($p.markets // [])
            )
          ' $(cat parts/list.txt) > web/docs/LLM_MATERIALS.json
          jq -r '.version, .timestamps.utc, (.markets|length)' web/docs/LLM_MATERIALS.json

      - name: Also publish web/docs/materials_current.b64gz.txt
        run: |
          set -euo pipefail
          gzip -c -9 web/docs/LLM_MATERIALS.json | base64 -w 0 > web/docs/materials_current.b64gz.txt
          head -c 4 web/docs/materials_current.b64gz.txt | sed -n '1p'

      - name: Commit & Push
        run: |
          set -euo pipefail
          git add web/docs/LLM_MATERIALS.json web/docs/materials_current.b64gz.txt || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com"                 commit -m "docs: publish materials (markets=$(wc -l < markets.txt))"
          git push
