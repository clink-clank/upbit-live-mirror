name: Materials Pipeline (5m)

on:
  schedule:
    - cron: "*/5 * * * *"   # UTC 기준 5분마다(정각 00/05/10/.../55)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: materials-pipeline
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup jq
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Build KRW market list (Upbit)
        run: |
          set -euo pipefail
          curl -4fsSL "https://api.upbit.com/v1/market/all?isDetails=false" -H "User-Agent: GA-mirror/1.1"             | jq -r '.[].market' | grep '^KRW-' > markets.txt
          echo "::notice title=KRW markets::$(wc -l < markets.txt)"

      - name: Fetch materials in chunks
        env:
          CHUNK: 10
        run: |
          set -euo pipefail
          rm -rf parts && mkdir -p parts
          mapfile -t ARR < markets.txt
          n=${#ARR[@]}; i=0; idx=1
          while [ $i -lt $n ]; do
            part=$(IFS=,; printf '%s' "${ARR[*]:i:${CHUNK}}")
            enc_part=$(printf '%s' "$part" | jq -sRr @uri)
            out="parts/part_${idx}.json"; ok=0
            for attempt in 1 2 3 4 5; do
              url="https://api.shenqn.uk/materials.json?mode=selected&full=1&markets=${enc_part}"
              code=$(curl -4sS -H "User-Agent: GA-mirror/1.1" -H "Accept: application/json"                     -w "%{http_code}" -o "$out.tmp" --max-time 60 "$url" || true)
              if [ "$code" = "200" ] && jq -e '(.markets|type=="array") and (.markets|length>=1)' "$out.tmp" >/dev/null 2>&1; then
                mv "$out.tmp" "$out"; ok=1; break
              fi
              sleep 1
            done
            [ "$ok" = "1" ] || { echo "::warning::part ${idx} failed"; rm -f "$out.tmp"; }
            i=$((i+CHUNK)); idx=$((idx+1))
          done
          ls -1 parts/part_*.json 2>/dev/null | sort > parts/list.txt || true

      - name: Merge -> LLM_MATERIALS.json
        run: |
          set -euo pipefail
          files=$(cat parts/list.txt 2>/dev/null || true)
          if [ -n "${files}" ]; then
            jq -s '
              def valid: type=="object" and (.markets|type=="array");
              def GOOD: [ .[] | select(valid) ];
              def M: [ GOOD[] | .markets[] ];
              def FIRST: (GOOD | first) // {};
              {
                version: (FIRST.version // "LLM_MATERIALS_V1"),
                timestamps: (FIRST.timestamps // {kst:"",utc:""}),
                meta: ((FIRST.meta // {}) as $m | ($m + {params: (($m.params // {}) + {markets: (M | map(.market) | unique)})})),
                markets: (M | unique_by(.market))
              }' $files > LLM_MATERIALS.json
          else
            echo "{}" > LLM_MATERIALS.json
          fi

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- LLM_MATERIALS.json; then
            git add LLM_MATERIALS.json
            git commit -m "chore(live): update LLM_MATERIALS.json (pipeline)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
            git push origin HEAD:"${GITHUB_REF_NAME:-main}" || true
          else
            echo "::notice title=Commit::No changes"
          fi
