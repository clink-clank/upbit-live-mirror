name: Materials Pipeline (5m)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"  # runs every 5 minutes (UTC)
  push:
    paths:
      - ".github/workflows/materials-pipeline.yml"

permissions:
  contents: write

concurrency:
  group: materials-pipeline
  cancel-in-progress: true

jobs:
  build_and_publish:
    name: Build & Publish materials
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHUNK: "10"
      # Known-good parts commit that probed OK earlier; override via env PIN_GOOD at dispatch time if needed
      PIN_GOOD: "35794df604aecf3d5126f8614e15896d7a290c0e"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ensure jq
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq
          jq --version

      - name: Publish LLM materials (pin, repair, join, push)
        run: |
          set -euo pipefail
          chmod +x bin/*.sh || true
          # Use the known-good pin (can be overridden by setting PIN_GOOD via workflow_dispatch inputs or env)
          bin/publish_llm_materials.sh web/docs/parts/materials.partlist.urls web/docs/LLM_MATERIALS.json "${PIN_GOOD}"
