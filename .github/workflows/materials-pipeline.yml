name: Materials Pipeline (5m)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "bin/**"
      - "web/docs/parts/**"
      - ".github/workflows/materials-pipeline.yml"

permissions:
  contents: write

concurrency:
  group: materials-pipeline
  cancel-in-progress: true

jobs:
  build_publish_slice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize line endings & ensure tools
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y dos2unix jq
          if [ -d bin ]; then
            find bin -type f -name "*.sh" -print0 | xargs -0 -I {} sh -c 'dos2unix "{}" || true'
            chmod +x bin/*.sh || true
          fi

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build & publish LLM materials (join parts ➜ JSON + single b64gz)
        env:
          PIN_GOOD: ${{ github.sha }}
          PIN_GOOD: "35794df604aecf3d5126f8614e15896d7a290c0e"
        run: |
          set -euo pipefail
          bash bin/publish_llm_materials.sh web/docs/parts/materials.partlist.urls web/docs/LLM_MATERIALS.json "$PIN_GOOD"

      - name: Slice 50 files for Jina proxy
        env:
          GITHUB_REPOSITORY: ${ github.repository }
          GITHUB_REF_NAME: ${ github.ref_name }
        run: |
          set -euo pipefail
          SRC=web/docs/LLM_MATERIALS.json
          OUTDIR=web/docs/jina_slices/materials_current
          mkdir -p "${OUTDIR}"
          # Create 50 slices (expects your repo's helper script)
          bash bin/slice50_prepare.sh "${SRC}" "${OUTDIR}" 50
          # Build manifest (list absolute Jina proxy URLs for each slice)
          TS="$(date -u +%FT%TZ)"
          MAN="${OUTDIR}/manifest.json"
          echo '{' > "${MAN}"
          echo '  "version": "JINA_SLICE_V1",' >> "${MAN}"
          echo '  "updated_utc": "'${TS}'",' >> "${MAN}"
          echo '  "slices": [' >> "${MAN}"
          first=1
          for f in $(ls -1 "${OUTDIR}" | sort); do
            [ "${f}" = "manifest.json" ] && continue
            url="https://r.jina.ai/https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/refs/heads/${GITHUB_REF_NAME}/${OUTDIR}/${f}"
            if [ $first -eq 0 ]; then echo "," >> "${MAN}"; fi
            printf '    "%s"' "${url}" >> "${MAN}"
            first=0
          done
          echo '' >> "${MAN}"
          echo '  ]' >> "${MAN}"
          echo '}' >> "${MAN}"
          jq . "${MAN}" > "${MAN}.tmp" && mv "${MAN}.tmp" "${MAN}"

      - name: Commit & push slices and manifest
        run: |
          set -euo pipefail
          git add web/docs/jina_slices/materials_current || true
          git commit -m "ci: update Jina slices (50) and manifest [skip ci]" || echo "nothing to commit"
          git push
