name: Mirror Upbit Materials (hot, single-file + shards)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mirror-hot
  cancel-in-progress: true

jobs:
  hot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # (여기: LLM_MATERIALS.json 생성/커밋 스텝이 있어야 함)
      # - name: Build & commit LLM_MATERIALS.json
      #   run: bash scripts/build_materials_hot.sh

      - name: Ensure Python
        run: python3 -V

      - name: Generate & commit 10 shards (materials_10/)
        run: |
          set -euo pipefail
          python3 scripts/split_llm_materials.py
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- materials_10/; then
            git add materials_10/*.json || true
            git commit -m "chore(hot): update materials_10 shards"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
            git push origin HEAD:"${GITHUB_REF_NAME:-main}" || true
            echo "::notice title=Commit::Pushed materials_10 shards"
          else
            echo "::notice title=Commit::No shard changes"
          fi
