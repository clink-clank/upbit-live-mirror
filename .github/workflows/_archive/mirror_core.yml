name: Mirror Core (single-file + 10 shards)
'on':
  workflow_call: {}
  workflow_dispatch: {}
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
jobs:
  mirror-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        run: python3 -V
      - name: Split LLM_MATERIALS.json into 10 shards (materials_10/)
        run: 'python3 scripts/split_llm_materials.py

          '
      - name: Commit and push shards
        run: "set -euo pipefail\ngit config user.name \"github-actions[bot]\"\ngit\
          \ config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\
          \ngit add materials_10/*.json || true\nif ! git diff --cached --quiet; then\n\
          \  git commit -m \"chore(core): update materials shards (10)\"\n  git push\n\
          \  echo \"::notice title=Commit::Pushed materials_10 shards\"\nelse\n  echo\
          \ \"::notice title=Commit::No shard changes\"\nfi\n"
